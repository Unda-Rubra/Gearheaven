# Default: 8.0
# Range: 1.0 ~ 64.0
aniseedWardRadius = 8.0
#是否启用 bighook 抓取生物功能：手持挂勾攻击当前生命值低于自己且非敌对/非Boss的生物（含其他玩家）时，可将其拿起
#玩家潜行（shift）无法挣脱时（此开关关闭）只能通过手里不再持有挂勾来放下生物
bighookCarryEnabled = true
#是否允许被抓取的生物或者挂在挂钩上的生物通过潜行（shift）挣脱/被放下
bighookShiftEscapeEnabled = true
