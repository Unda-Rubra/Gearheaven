# Range: 0.0 ~ 100.0
exposeEvilBloodFireDamage = 4.0
#武圣（guan_yu_strike）效果下，食物攻击转化的真实伤害上限，默认 8.0
# Default: 8.0
# Range: 0.0 ~ 100.0
guanYuStrikeMaxRealDamage = 8.0
#八角镇香（aniseed_ward）效果总开关，关闭后不再触发与生效
aniseedWardEnabled = true
